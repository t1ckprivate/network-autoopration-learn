<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Live Network Map</title>

        <!-- Leaflet.js -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
        />
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

        <!-- Turf.js for Great Circle routes -->
        <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

        <!-- Socket.IO -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: black;
                overflow: hidden;
            }
            #map {
                height: 100vh;
                width: 100%;
            }

            /* Moving Pulse */
            .pulse {
                width: 6px;
                height: 6px;
                background-color: #ff00ff;
                border-radius: 50%;
                box-shadow: 0 0 5px #ff00ff;
                position: absolute;
                transform: translate(-50%, -50%);
            }

            /* Stats Panel */
            #stats-container {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 15px;
                border-radius: 8px;
                font-family: Arial, sans-serif;
                max-width: 300px;
                z-index: 1000;
            }
            #stats-title {
                font-size: 16px;
                font-weight: bold;
                margin-bottom: 10px;
            }
            #stats-list {
                font-size: 14px;
                list-style: none;
                padding: 0;
                margin: 0;
            }
            #stats-list li {
                padding: 5px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            }
        </style>
    </head>
    <body>
        <div id="map"></div>

        <div id="stats-container">
            <div id="stats-title">🌍 Traffic Statistics</div>
            <ul id="stats-list"></ul>
        </div>

        <script>
            // ==================== Map Init ====================
            var map = L.map("map").setView([20, 0], 2);

            L.tileLayer(
                "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
                {
                    attribution:
                        '&copy; <a href="https://carto.com/">CARTO</a>',
                    subdomains: "abcd",
                    maxZoom: 20,
                },
            ).addTo(map);

            console.log("✅ Map initialized");

            // ==================== WebSocket ====================
            var socket = io.connect("http://127.0.0.1:23323");
            socket.on("connect", function () {
                console.log("✅ WebSocket connected");
            });

            // ==================== State ====================
            var countryStats = {};
            var sourceLat = 51.1657,
                sourceLon = 10.4515; // Default: Germany

            // Get user's real location
            fetch("https://ipinfo.io/json")
                .then(function (r) {
                    return r.json();
                })
                .then(function (data) {
                    if (data.loc) {
                        var parts = data.loc.split(",");
                        sourceLat = parseFloat(parts[0]);
                        sourceLon = parseFloat(parts[1]);
                        console.log(
                            "📍 Your location: " + sourceLat + ", " + sourceLon,
                        );
                    }
                })
                .catch(function (e) {
                    console.warn(
                        "⚠ Could not get your IP location, using default",
                    );
                });

            // ==================== Handle incoming data ====================
            socket.on("update_map", function (data) {
                console.log("📡 update_map received:", data);

                if (!data.lat || !data.lon) return;

                var targetLat = data.lat;
                var targetLon = data.lon;
                var country = data.country || "Unknown";
                var dataSize = parseInt(data.size) || 0;

                // Update stats
                if (!countryStats[country]) {
                    countryStats[country] = { connections: 0, traffic: 0 };
                }
                countryStats[country].connections++;
                countryStats[country].traffic += dataSize;
                updateStatsDisplay();

                // Draw animated line
                animatePulseLine(
                    [sourceLat, sourceLon],
                    [targetLat, targetLon],
                );
            });

            // ==================== Animated line ====================
            function animatePulseLine(start, end) {
                var path = getGreatCirclePath(start, end, 30);
                var step = 0;

                var laserLine = L.polyline([], {
                    color: "#a600ff",
                    weight: 3,
                    opacity: 1.0,
                }).addTo(map);

                var pulseMarker = L.marker(start, {
                    icon: L.divIcon({ className: "pulse", iconSize: [12, 12] }),
                }).addTo(map);

                var interval = setInterval(function () {
                    if (step < path.length) {
                        laserLine.setLatLngs(path.slice(0, step + 1));
                        pulseMarker.setLatLng(path[step]);
                        step++;
                    } else {
                        clearInterval(interval);
                        setTimeout(function () {
                            fadeOutLayer(laserLine, 1.0);
                        }, 2000);
                        setTimeout(function () {
                            map.removeLayer(pulseMarker);
                        }, 3200);
                    }
                }, 50);
            }

            // Great Circle path (Turf uses [lon,lat]; Leaflet uses [lat,lon])
            function getGreatCirclePath(start, end, numPoints) {
                // start/end are [lat, lon] -> convert to [lon, lat] for Turf
                var line = turf.greatCircle(
                    turf.point([start[1], start[0]]),
                    turf.point([end[1], end[0]]),
                    { npoints: numPoints },
                );
                // Turf returns [lon, lat] -> convert back to [lat, lon] for Leaflet
                return line.geometry.coordinates.map(function (coord) {
                    return [coord[1], coord[0]];
                });
            }

            function fadeOutLayer(layer, opacity) {
                if (opacity <= 0) {
                    map.removeLayer(layer);
                    return;
                }
                opacity -= 0.1;
                if (layer.setStyle) {
                    layer.setStyle({ opacity: opacity });
                }
                setTimeout(function () {
                    fadeOutLayer(layer, opacity);
                }, 100);
            }

            // ==================== Stats ====================
            function updateStatsDisplay() {
                var list = document.getElementById("stats-list");
                list.innerHTML = "";

                var sorted = Object.entries(countryStats).sort(function (a, b) {
                    return b[1].traffic - a[1].traffic;
                });

                sorted.forEach(function (entry) {
                    var country = entry[0];
                    var data = entry[1];
                    var li = document.createElement("li");
                    li.innerText =
                        country +
                        ": " +
                        data.connections +
                        " Packets - " +
                        formatBytes(data.traffic);
                    list.appendChild(li);
                });
            }

            function formatBytes(bytes) {
                if (bytes < 1024) return bytes + " B";
                var units = ["KB", "MB", "GB", "TB"];
                var i = -1;
                do {
                    bytes /= 1024;
                    i++;
                } while (bytes >= 1024 && i < units.length - 1);
                return bytes.toFixed(1) + " " + units[i];
            }
        </script>
    </body>
</html>
